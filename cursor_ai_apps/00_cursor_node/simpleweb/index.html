<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자기소개</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>안녕하세요! 👋</h1>
            <p class="subtitle">자기소개 페이지</p>
        </header>
        
        <main>
            <section class="profile">
                <h2>프로필</h2>
                <div class="info">
                    <p><strong>이름:</strong> [이름을 입력하세요]</p>
                    <p><strong>직업:</strong> [직업을 입력하세요]</p>
                    <p><strong>이메일:</strong> [이메일을 입력하세요]</p>
                </div>
            </section>

            <section class="about">
                <h2>소개</h2>
                <p>[자신에 대한 소개를 작성하세요]</p>
            </section>

            <section class="skills">
                <h2>기술 스택</h2>
                <ul>
                    <li>Python</li>
                    <li>Node.js</li>
                    <li>[추가 기술]</li>
                </ul>
            </section>
        </main>

        <footer>
            <p>&copy; 2024 자기소개 페이지</p>
        </footer>
    </div>
</body>
</html>
