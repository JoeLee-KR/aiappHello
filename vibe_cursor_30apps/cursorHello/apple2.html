<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사과 게임 2 | nxclabs.com</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; touch-action: none; overflow: hidden; }
        #game-canvas { border: 4px solid rgba(255,255,255,0.3); border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .bounce { animation: bounce 0.5s ease-in-out; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="mb-6 text-center">
        <h1 class="text-5xl font-extrabold mb-2 text-yellow-300 drop-shadow-lg">사과 게임 2</h1>
        <p class="text-gray-200 text-lg">사과를 클릭해서 제거하세요! <span class="text-yellow-400 font-bold">3개 이상</span> 연결된 사과는 한 번에 사라집니다!</p>
    </div>

    <div class="relative bg-white/10 backdrop-blur-lg p-6 rounded-2xl shadow-2xl border border-white/20">
        <div class="flex justify-between mb-4 px-2">
            <div class="text-2xl font-mono">점수: <span id="score" class="text-yellow-300">0</span></div>
            <div class="text-2xl font-mono">남은 사과: <span id="remaining" class="text-emerald-300">0</span></div>
        </div>
        
        <canvas id="game-canvas" width="600" height="500"></canvas>
        
        <div class="mt-6 flex gap-4">
            <button id="reset-btn" class="flex-1 bg-white/20 hover:bg-white/30 backdrop-blur text-white font-bold py-3 rounded-xl transition border border-white/30">새 게임</button>
            <button id="shuffle-btn" class="px-6 bg-purple-500/50 hover:bg-purple-500/70 text-white font-bold py-3 rounded-xl transition border border-purple-300/30">섞기</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const remainingElement = document.getElementById('remaining');
        const resetBtn = document.getElementById('reset-btn');
        const shuffleBtn = document.getElementById('shuffle-btn');

        const ROWS = 8;
        const COLS = 10;
        const APPLE_SIZE = 60;
        const COLORS = ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#ec4899'];

        let grid = [];
        let score = 0;
        let selectedApple = null;
        let isAnimating = false;

        class Apple {
            constructor(row, col, colorIndex) {
                this.row = row;
                this.col = col;
                this.colorIndex = colorIndex;
                this.color = COLORS[colorIndex];
                this.x = col * APPLE_SIZE;
                this.y = row * APPLE_SIZE;
                this.removed = false;
                this.falling = false;
                this.targetY = this.y;
            }

            draw() {
                if (this.removed) return;
                
                // Apple shadow
                ctx.beginPath();
                ctx.arc(this.x + APPLE_SIZE/2 + 2, this.y + APPLE_SIZE/2 + 2, 20, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fill();
                
                // Apple body
                ctx.beginPath();
                ctx.arc(this.x + APPLE_SIZE/2, this.y + APPLE_SIZE/2, 20, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // Apple highlight
                ctx.beginPath();
                ctx.arc(this.x + APPLE_SIZE/2 - 5, this.y + APPLE_SIZE/2 - 5, 6, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.fill();
                
                // Selected indicator
                if (selectedApple === this) {
                    ctx.strokeStyle = '#fbbf24';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(this.x + 2, this.y + 2, APPLE_SIZE - 4, APPLE_SIZE - 4);
                }
            }
        }

        function initGame() {
            grid = [];
            score = 0;
            selectedApple = null;
            scoreElement.innerText = score;
            
            for (let r = 0; r < ROWS; r++) {
                grid[r] = [];
                for (let c = 0; c < COLS; c++) {
                    grid[r][c] = new Apple(r, c, Math.floor(Math.random() * COLORS.length));
                }
            }
            updateRemaining();
            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (grid[r][c]) {
                        grid[r][c].draw();
                    }
                }
            }
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const col = Math.floor(x / APPLE_SIZE);
            const row = Math.floor(y / APPLE_SIZE);
            return { row, col, x, y };
        }

        function findConnected(row, col, colorIndex, visited = new Set()) {
            const key = `${row},${col}`;
            if (visited.has(key)) return [];
            if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return [];
            if (!grid[row] || !grid[row][col] || grid[row][col].removed) return [];
            if (grid[row][col].colorIndex !== colorIndex) return [];
            
            visited.add(key);
            let connected = [{row, col}];
            
            const directions = [[-1,0], [1,0], [0,-1], [0,1]];
            for (const [dr, dc] of directions) {
                connected = connected.concat(findConnected(row + dr, col + dc, colorIndex, visited));
            }
            
            return connected;
        }

        function removeApples(connected) {
            if (connected.length < 3) return false;
            
            connected.forEach(({row, col}) => {
                grid[row][col].removed = true;
            });
            
            score += connected.length * 10;
            scoreElement.innerText = score;
            updateRemaining();
            
            // Gravity: 사과들이 아래로 떨어지도록
            applyGravity();
            return true;
        }

        function applyGravity() {
            for (let c = 0; c < COLS; c++) {
                let writePos = ROWS - 1;
                for (let r = ROWS - 1; r >= 0; r--) {
                    if (grid[r] && grid[r][c] && !grid[r][c].removed) {
                        if (writePos !== r) {
                            grid[writePos][c] = grid[r][c];
                            grid[writePos][c].row = writePos;
                            grid[writePos][c].y = writePos * APPLE_SIZE;
                            grid[r][c] = null;
                        }
                        writePos--;
                    } else if (grid[r] && grid[r][c] && grid[r][c].removed) {
                        grid[r][c] = null;
                    }
                }
                
                // Fill empty spaces with new apples
                for (let r = writePos; r >= 0; r--) {
                    grid[r][c] = new Apple(r, c, Math.floor(Math.random() * COLORS.length));
                }
            }
        }

        function updateRemaining() {
            let count = 0;
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (grid[r] && grid[r][c] && !grid[r][c].removed) {
                        count++;
                    }
                }
            }
            remainingElement.innerText = count;
        }

        function shuffle() {
            const allApples = [];
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (grid[r] && grid[r][c] && !grid[r][c].removed) {
                        allApples.push(grid[r][c].colorIndex);
                    }
                }
            }
            
            // Shuffle colors
            for (let i = allApples.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [allApples[i], allApples[j]] = [allApples[j], allApples[i]];
            }
            
            let idx = 0;
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (grid[r] && grid[r][c] && !grid[r][c].removed) {
                        grid[r][c].colorIndex = allApples[idx++];
                        grid[r][c].color = COLORS[grid[r][c].colorIndex];
                    }
                }
            }
            draw();
        }

        canvas.addEventListener('click', (e) => {
            if (isAnimating) return;
            
            const {row, col} = getMousePos(e);
            if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return;
            if (!grid[row] || !grid[row][col] || grid[row][col].removed) return;
            
            const apple = grid[row][col];
            const connected = findConnected(row, col, apple.colorIndex);
            
            if (connected.length >= 3) {
                removeApples(connected);
                draw();
            } else {
                selectedApple = apple;
                draw();
                setTimeout(() => {
                    selectedApple = null;
                    draw();
                }, 300);
            }
        });

        resetBtn.addEventListener('click', initGame);
        shuffleBtn.addEventListener('click', shuffle);

        initGame();
    </script>
</body>
</html>
