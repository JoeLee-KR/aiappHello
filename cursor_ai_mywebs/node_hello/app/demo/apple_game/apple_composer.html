<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사과 게임 2 | nxclabs.com</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; touch-action: none; overflow: hidden; }
        #game-canvas { border: 4px solid rgba(255,255,255,0.3); border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .bounce { animation: bounce 0.5s ease-in-out; }
        #game-over-modal { display: none; }
        #game-over-modal.show { display: flex; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="mb-6 text-center">
        <h1 class="text-5xl font-extrabold mb-2 text-yellow-300 drop-shadow-lg">사과 게임 2</h1>
        <p class="text-gray-200 text-lg">사과를 클릭해서 제거하세요! <span class="text-yellow-400 font-bold">3개 이상</span> 연결된 사과는 한 번에 사라집니다!</p>
    </div>

    <div class="relative bg-white/10 backdrop-blur-lg p-6 rounded-2xl shadow-2xl border border-white/20">
        <div class="flex justify-between mb-4 px-2 flex-wrap gap-4">
            <div class="text-xl font-mono">점수: <span id="score" class="text-yellow-300">0</span></div>
            <div class="text-xl font-mono">제거 가능: <span id="removable" class="text-emerald-300">0</span>개</div>
            <div class="text-xl font-mono">제거한 사과: <span id="removed" class="text-red-300">0</span>개</div>
        </div>
        
        <canvas id="game-canvas" width="600" height="500"></canvas>
    </div>

    <!-- Game Over Modal -->
    <div id="game-over-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50">
        <div class="bg-white/10 backdrop-blur-lg rounded-2xl p-8 border border-white/20 shadow-2xl max-w-md w-full mx-4">
            <h2 class="text-4xl font-extrabold text-center mb-4 text-red-400">게임 오버!</h2>
            <p class="text-xl text-center mb-2 text-gray-200">더 이상 제거할 수 있는 조합이 없습니다.</p>
            <div class="text-center mb-6">
                <p class="text-lg text-yellow-300">최종 점수: <span id="final-score" class="text-2xl font-bold">0</span></p>
                <p class="text-lg text-red-300 mt-2">제거한 사과: <span id="final-removed" class="text-xl font-bold">0</span>개</p>
            </div>
            <button id="new-game-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-xl transition text-xl">
                새 게임 시작
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const removableElement = document.getElementById('removable');
        const removedElement = document.getElementById('removed');
        const gameOverModal = document.getElementById('game-over-modal');
        const finalScoreElement = document.getElementById('final-score');
        const finalRemovedElement = document.getElementById('final-removed');
        const newGameBtn = document.getElementById('new-game-btn');

        const ROWS = 8;
        const COLS = 10;
        const APPLE_SIZE = 60;
        const COLORS = ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#ec4899'];

        let grid = [];
        let score = 0;
        let removedCount = 0;
        let selectedApple = null;
        let isAnimating = false;
        let gameActive = true;

        class Apple {
            constructor(row, col, colorIndex) {
                this.row = row;
                this.col = col;
                this.colorIndex = colorIndex;
                this.color = COLORS[colorIndex];
                this.x = col * APPLE_SIZE;
                this.y = row * APPLE_SIZE;
                this.removed = false;
                this.falling = false;
                this.targetY = this.y;
            }

            draw() {
                if (this.removed) return;
                
                // Apple shadow
                ctx.beginPath();
                ctx.arc(this.x + APPLE_SIZE/2 + 2, this.y + APPLE_SIZE/2 + 2, 20, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fill();
                
                // Apple body
                ctx.beginPath();
                ctx.arc(this.x + APPLE_SIZE/2, this.y + APPLE_SIZE/2, 20, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // Apple highlight
                ctx.beginPath();
                ctx.arc(this.x + APPLE_SIZE/2 - 5, this.y + APPLE_SIZE/2 - 5, 6, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.fill();
                
                // Selected indicator
                if (selectedApple === this) {
                    ctx.strokeStyle = '#fbbf24';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(this.x + 2, this.y + 2, APPLE_SIZE - 4, APPLE_SIZE - 4);
                }
            }
        }

        function initGame() {
            grid = [];
            score = 0;
            removedCount = 0;
            selectedApple = null;
            gameActive = true;
            scoreElement.innerText = score;
            removedElement.innerText = removedCount;
            gameOverModal.classList.remove('show');
            
            for (let r = 0; r < ROWS; r++) {
                grid[r] = [];
                for (let c = 0; c < COLS; c++) {
                    grid[r][c] = new Apple(r, c, Math.floor(Math.random() * COLORS.length));
                }
            }
            updateRemovable();
            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (grid[r][c]) {
                        grid[r][c].draw();
                    }
                }
            }
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const col = Math.floor(x / APPLE_SIZE);
            const row = Math.floor(y / APPLE_SIZE);
            return { row, col, x, y };
        }

        function findConnected(row, col, colorIndex, visited = new Set()) {
            const key = `${row},${col}`;
            if (visited.has(key)) return [];
            if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return [];
            if (!grid[row] || !grid[row][col] || grid[row][col].removed) return [];
            if (grid[row][col].colorIndex !== colorIndex) return [];
            
            visited.add(key);
            let connected = [{row, col}];
            
            const directions = [[-1,0], [1,0], [0,-1], [0,1]];
            for (const [dr, dc] of directions) {
                connected = connected.concat(findConnected(row + dr, col + dc, colorIndex, visited));
            }
            
            return connected;
        }

        function calculateScore(count) {
            if (count <= 3) {
                return count; // 첫 3개는 각 1점
            }
            // 3개 초과 시: 3점(기본) + (추가 개수) × (추가 개수 + 1)
            // 4개: 3 + 1×2 = 5점
            // 5개: 3 + 1×2 + 2×2 = 9점
            // 6개: 3 + 1×2 + 2×2 + 3×2 = 15점
            const extra = count - 3;
            return 3 + extra * (extra + 1);
        }

        function removeApples(connected) {
            if (connected.length < 3) return false;
            
            connected.forEach(({row, col}) => {
                grid[row][col].removed = true;
            });
            
            const pointsEarned = calculateScore(connected.length);
            score += pointsEarned;
            removedCount += connected.length;
            scoreElement.innerText = score;
            removedElement.innerText = removedCount;
            
            // Gravity: 사과들이 아래로 떨어지도록
            applyGravity();
            updateRemovable();
            return true;
        }

        function applyGravity() {
            for (let c = 0; c < COLS; c++) {
                let writePos = ROWS - 1;
                for (let r = ROWS - 1; r >= 0; r--) {
                    if (grid[r] && grid[r][c] && !grid[r][c].removed) {
                        if (writePos !== r) {
                            grid[writePos][c] = grid[r][c];
                            grid[writePos][c].row = writePos;
                            grid[writePos][c].y = writePos * APPLE_SIZE;
                            grid[r][c] = null;
                        }
                        writePos--;
                    } else if (grid[r] && grid[r][c] && grid[r][c].removed) {
                        grid[r][c] = null;
                    }
                }
                
                // Fill empty spaces with new apples
                for (let r = writePos; r >= 0; r--) {
                    grid[r][c] = new Apple(r, c, Math.floor(Math.random() * COLORS.length));
                }
            }
        }

        function updateRemovable() {
            const visitedCombinations = new Set();
            let totalRemovable = 0;
            
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (!grid[r] || !grid[r][c] || grid[r][c].removed) continue;
                    
                    const key = `${r},${c}`;
                    if (visitedCombinations.has(key)) continue;
                    
                    const connected = findConnected(r, c, grid[r][c].colorIndex);
                    if (connected.length >= 3) {
                        connected.forEach(({row, col}) => {
                            visitedCombinations.add(`${row},${col}`);
                        });
                        totalRemovable += connected.length;
                    }
                }
            }
            
            removableElement.innerText = totalRemovable;
            
            // 게임오버 체크
            if (totalRemovable === 0 && gameActive) {
                gameOver();
            }
        }

        function gameOver() {
            gameActive = false;
            finalScoreElement.innerText = score;
            finalRemovedElement.innerText = removedCount;
            gameOverModal.classList.add('show');
        }


        canvas.addEventListener('click', (e) => {
            if (isAnimating || !gameActive) return;
            
            const {row, col} = getMousePos(e);
            if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return;
            if (!grid[row] || !grid[row][col] || grid[row][col].removed) return;
            
            const apple = grid[row][col];
            const connected = findConnected(row, col, apple.colorIndex);
            
            if (connected.length >= 3) {
                removeApples(connected);
                draw();
            } else {
                selectedApple = apple;
                draw();
                setTimeout(() => {
                    selectedApple = null;
                    draw();
                }, 300);
            }
            updateRemovable();
        });

        newGameBtn.addEventListener('click', initGame);

        initGame();
    </script>
</body>
</html>
