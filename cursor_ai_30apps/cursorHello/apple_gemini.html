<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사과 게임 (Apple Game) | nxclabs.com</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #1a1a1a; color: white; touch-action: none; }
        #game-canvas { border: 4px solid #333; border-radius: 8px; cursor: crosshair; }
        .selected { background-color: rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="mb-6 text-center">
        <h1 class="text-4xl font-extrabold mb-2 text-red-500">사과 게임</h1>
        <p class="text-gray-400">드래그하여 숫자의 합이 <span class="text-yellow-400 font-bold">10의 배수</span>가 되게 만드세요!</p>
    </div>

    <div class="relative bg-zinc-900 p-6 rounded-2xl shadow-2xl border border-zinc-800">
        <div class="flex justify-between mb-4 px-2">
            <div class="text-xl font-mono">Score: <span id="score" class="text-emerald-400">0</span></div>
            <div class="text-xl font-mono">Time: <span id="timer" class="text-red-400">0</span>s</div>
        </div>
        
        <canvas id="game-canvas" width="600" height="400"></canvas>
        
        <div class="mt-6 flex gap-4">
            <button id="reset-btn" class="flex-1 bg-zinc-800 hover:bg-zinc-700 text-white font-bold py-3 rounded-xl transition">다시 시작</button>
            <button id="hint-btn" class="px-6 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition">힌트</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const timerElement = document.getElementById('timer');
        const resetBtn = document.getElementById('reset-btn');

        const ROWS = 10;
        const COLS = 15;
        const APPLE_SIZE = 40;
        const PADDING = 0;

        let apples = [];
        let score = 0;
        let timeLeft = 0;
        let isDragging = false;
        let startX, startY, endX, endY;
        let gameActive = true;

        class Apple {
            constructor(row, col) {
                this.row = row;
                this.col = col;
                this.value = Math.floor(Math.random() * 9) + 1;
                this.x = col * APPLE_SIZE;
                this.y = row * APPLE_SIZE;
                this.removed = false;
            }

            draw() {
                if (this.removed) return;
                
                // Draw Apple
                ctx.beginPath();
                ctx.arc(this.x + APPLE_SIZE/2, this.y + APPLE_SIZE/2, 16, 0, Math.PI * 2);
                ctx.fillStyle = '#ef4444';
                ctx.fill();
                
                // Draw Number
                ctx.fillStyle = 'white';
                ctx.font = 'bold 18px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.value, this.x + APPLE_SIZE/2, this.y + APPLE_SIZE/2);
            }
        }

        function initGame() {
            apples = [];
            score = 0;
            timeLeft = 240;
            gameActive = true;
            scoreElement.innerText = score;
            timerElement.innerText = timeLeft;
            
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    apples.push(new Apple(r, c));
                }
            }
            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            apples.forEach(apple => apple.draw());

            if (isDragging) {
                ctx.strokeStyle = 'rgba(52, 211, 153, 0.8)';
                ctx.lineWidth = 2;
                ctx.strokeRect(startX, startY, endX - startX, endY - startY);
                ctx.fillStyle = 'rgba(52, 211, 153, 0.1)';
                ctx.fillRect(startX, startY, endX - startX, endY - startY);
            }
        }

        function getSelectedApples() {
            const x1 = Math.min(startX, endX);
            const x2 = Math.max(startX, endX);
            const y1 = Math.min(startY, endY);
            const y2 = Math.max(startY, endY);

            return apples.filter(apple => {
                if (apple.removed) return false;
                const appleCenterX = apple.x + APPLE_SIZE / 2;
                const appleCenterY = apple.y + APPLE_SIZE / 2;
                return appleCenterX >= x1 && appleCenterX <= x2 && 
                       appleCenterY >= y1 && appleCenterY <= y2;
            });
        }

        canvas.addEventListener('mousedown', (e) => {
            if (!gameActive) return;
            isDragging = true;
            const rect = canvas.getBoundingClientRect();
            startX = e.clientX - rect.left;
            startY = e.clientY - rect.top;
            endX = startX;
            endY = startY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const rect = canvas.getBoundingClientRect();
            endX = e.clientX - rect.left;
            endY = e.clientY - rect.top;
            draw();
        });

        window.addEventListener('mouseup', () => {
            if (!isDragging) return;
            isDragging = false;

            const selected = getSelectedApples();
            const sum = selected.reduce((s, apple) => s + apple.value, 0);

            if (sum % 10 === 0 && sum > 0) {
                selected.forEach(apple => apple.removed = true);
                score += selected.length;
                scoreElement.innerText = score;
            }
            draw();
        });

        // Timer
        setInterval(() => {
            if (gameActive && timeLeft > 0) {
                timeLeft--;
                timerElement.innerText = timeLeft;
                if (timeLeft <= 0) {
                    gameActive = false;
                    alert(`게임 종료! 최종 점수: ${score}`);
                }
            }
        }, 1000);

        resetBtn.addEventListener('click', initGame);

        initGame();
    </script>
</body>
</html>
